<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сколько? · Seven a day</title>
<meta name="description" content="Seven tasks a day: guess a number, draw a river, outline a country, find a city, place the Titanic at its depth. Share your row.">
<meta property="og:title" content="Seven tasks a day">
<meta property="og:image" content="https://quoline.app/og.png">
<meta property="og:description" content="How many trees are on Earth? Draw the Nile. How deep is the Titanic? Seven a day, compare with friends.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #ece2cc; --panel: #f6eedd; --ink: #2a2116; --body: #4d4231; --dim: #85755d; --line: #d8c8a8; --chip: #e6d9bd;
    --acc: #b45309; --acc-ink: #fff7ed; --title: Georgia, "Times New Roman", serif;
    --sea1: #c2d7d2; --sea2: #a8c2bd; --land: #eadab4; --border: #b49c74; --coast: rgba(40,80,80,.28); --grat: rgba(70,55,30,.13);
    --truth: #b91c1c; --user: #1f2937;
    --g: #22c55e; --y: #eab308; --o: #f97316; --r: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 22px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: var(--title); font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
  .brand small { display: block; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 500; color: var(--dim); }
  .lang { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 9px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .dots { display: flex; gap: 6px; margin: 20px 0 18px; }
  .dot { flex: 1; height: 6px; border-radius: 3px; background: var(--line); transition: background .3s; }
  .dot.now { background: var(--dim); }
  .dot.g { background: var(--g); } .dot.y { background: var(--y); } .dot.o { background: var(--o); } .dot.r { background: var(--r); }
  .kind { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--dim);
          background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; margin-bottom: 12px; }
  .kind svg { width: 14px; height: 14px; }
  h1 { font-family: var(--title); font-size: clamp(25px, 5.6vw, 36px); line-height: 1.12; letter-spacing: -0.3px; margin: 0 0 8px; font-weight: 700; }
  .hint { color: var(--body); font-size: 15px; line-height: 1.45; margin-bottom: 4px; }
  .hint b { color: var(--ink); font-weight: 600; }
  .how { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  /* numbers */
  .field { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 14px; padding: 16px; font: inherit; font-size: 20px; font-weight: 600; outline: none; }
  input:focus { border-color: var(--dim); }
  .read { color: var(--dim); font-size: 14px; min-height: 20px; margin: 10px 2px 0; }
  .units { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .units button { background: var(--panel); border: 1px solid var(--line); color: var(--body); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .answer { font-family: var(--title); font-size: clamp(32px, 8vw, 48px); font-weight: 700; letter-spacing: -1px; margin: 4px 0 0; }
  .yours { color: var(--dim); font-size: 14px; }
  /* years */
  .yrval { font-family: var(--title); font-size: clamp(48px, 12vw, 80px); font-weight: 700; letter-spacing: -2px; text-align: center; margin: 6px 0 4px; min-height: 1.1em; }
  .yrval.empty { color: var(--line); }
  .track { position: relative; height: 92px; margin: 6px 6px 0; touch-action: none; cursor: pointer; user-select: none; }
  .track .line { position: absolute; left: 0; right: 0; top: 44px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #d8c8a8, #b49c74); }
  .track .tk { position: absolute; top: 56px; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: var(--dim); }
  .track .tk::before { content: ""; position: absolute; left: 50%; top: -12px; width: 1px; height: 8px; background: var(--dim); opacity: .6; }
  .track .knob { position: absolute; top: 30px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: var(--ink); border: 4px solid var(--bg);
                 box-shadow: 0 6px 14px rgba(0,0,0,.25); transition: transform .12s; }
  .track .knob.idle { opacity: .25; }
  .track .truthmk { position: absolute; top: 6px; width: 3px; height: 50px; margin-left: -1.5px; background: var(--truth); border-radius: 2px; }
  .track .truthmk b { position: absolute; top: -2px; left: 8px; font-size: 14px; color: var(--truth); white-space: nowrap; }
  .yrbtns { display: flex; justify-content: center; gap: 8px; margin-top: 4px; }
  .yrbtns button { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 11px; padding: 9px 14px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; min-width: 58px; }
  /* map */
  .frame { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 20px 50px -22px rgba(60,40,10,.5); }
  .frame::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 18px; box-shadow: inset 0 0 70px rgba(120,90,40,.25); }
  svg.board { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  #mapsvg { cursor: crosshair; } #mapsvg.moving { cursor: grab; } #lvsvg { cursor: ns-resize; }
  #mapsvg path, #mapsvg circle { vector-effect: non-scaling-stroke; }
  #mapsvg { overflow: visible; transform-origin: 0 0; clip-path: inset(-70%); }
  #mapsvg.live { will-change: transform; }
  #mapsvg * { pointer-events: none; }   /* the clicks go to the map itself: hit-testing 50 000 coast points on every move was the lag */
  .zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  .zoom button { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 88%, transparent);
                 color: var(--ink); font: 600 19px/1 "Segoe UI", system-ui, sans-serif; cursor: pointer; display: grid; place-items: center; }
  .zoom button svg { width: 18px; height: 18px; }
  .zoom button.on { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .land { fill: var(--land); stroke: var(--land); stroke-width: 1.1; stroke-linejoin: round; }
  .land.borders { stroke: var(--border); stroke-width: .8; }
  .coast { fill: none; stroke: var(--coast); stroke-width: 7; stroke-linejoin: round; }
  .grat { fill: none; stroke: var(--grat); stroke-width: 1; }
  .user { fill: none; stroke: var(--user); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .user.closed { fill: color-mix(in srgb, var(--user) 9%, transparent); }
  .user.done { opacity: .6; }
  .truth { fill: none; stroke: var(--truth); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1); }
  .truth.area { fill: color-mix(in srgb, var(--truth) 14%, transparent); transition: stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1), fill-opacity .6s .8s; }
  .pin { fill: var(--user); stroke: var(--bg); stroke-width: 2.5; }
  .ring { fill: none; stroke: var(--truth); stroke-width: 2.5; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { transform: scale(.4); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
  .label { font: 700 18px "Segoe UI", system-ui, sans-serif; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  /* level */
  .tick { font: 600 12px "Segoe UI", system-ui, sans-serif; }
  .obj { font-size: 46px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .now { font: 700 15px "Segoe UI", system-ui, sans-serif; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
  .zone { font: 600 12px "Segoe UI", system-ui, sans-serif; fill: rgba(255,255,255,.55); letter-spacing: .4px; }
  /* common */
  .tools { display: flex; gap: 8px; margin-top: 14px; }
  button.go { flex: 1; background: var(--acc); color: var(--acc-ink); border: 0; border-radius: 14px; padding: 15px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  button.go:disabled { opacity: .35; cursor: default; }
  button.ghost { background: var(--panel); border: 1px solid var(--line); color: var(--body); border-radius: 14px; padding: 15px 20px; font: inherit; font-size: 15px; cursor: pointer; }
  .verdict { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .verdict b { display: block; font-size: 18px; }
  .verdict span.km { color: var(--dim); font-size: 14px; }
  .fact { color: var(--body); font-size: 15px; line-height: 1.5; margin: 12px 2px 0; }
  .src { color: var(--dim); font-size: 12px; margin: 4px 2px 0; }
  .sq { width: 30px; height: 30px; border-radius: 8px; flex: none; }
  .sq.g { background: var(--g); } .sq.y { background: var(--y); } .sq.o { background: var(--o); } .sq.r { background: var(--r); }
  .score { font-family: var(--title); font-size: 64px; font-weight: 800; letter-spacing: -2px; }
  .score small { font-size: 24px; color: var(--dim); font-weight: 600; letter-spacing: 0; }
  .row { display: flex; gap: 8px; margin: 16px 0 20px; flex-wrap: wrap; }
  .row .sq { width: 44px; height: 44px; border-radius: 11px; }
  .cardwrap { margin: 6px 0 4px; display: flex; justify-content: center; }
  #cardimg { width: min(100%, 340px); aspect-ratio: 4 / 5; border-radius: 14px; box-shadow: 0 30px 60px -28px rgba(60,40,10,.75), 0 0 0 1px rgba(0,0,0,.06);
             background: var(--panel); transform: rotate(-1.6deg); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  #cardimg:hover { transform: rotate(0deg) scale(1.02); }
  .tools.sub { margin-top: 8px; } .tools.sub button { flex: 1; padding: 12px; }
  .copied, .wait { color: var(--dim); font-size: 14px; text-align: center; min-height: 20px; margin-top: 10px; }
  .review { margin-top: 18px; }
  .review div { display: flex; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--body); }
  .review .sq { width: 14px; height: 14px; border-radius: 4px; position: relative; top: 2px; }
  .review b { color: var(--ink); white-space: nowrap; margin-left: auto; padding-left: 10px; font-weight: 600; }
  .legend { color: var(--dim); font-size: 13px; margin-top: 26px; line-height: 1.8; }
  .legend span.sq { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 5px 0 12px; }
  .legend span.sq:first-child { margin-left: 0; }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  footer p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.5; max-width: 420px; }
  footer p b { color: var(--ink); font-weight: 600; }
  footer a.btn { background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 16px; border-radius: 11px; white-space: nowrap; }
  .credit { color: var(--dim); opacity: .7; font-size: 12px; margin-top: 14px; }
  .brand small a.by { color: var(--dim); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .brand small a.by:hover { color: var(--ink); }
  .brand small svg { width: 13px; height: 13px; color: var(--ink); }
  .promo { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; margin: 22px 0 6px; padding: 16px 18px; border-radius: 16px;
           background: #0d0e11; color: #f5f5f7; text-decoration: none; box-shadow: 0 18px 40px -20px rgba(0,0,0,.6); }
  .promo .pbar { display: flex; align-items: center; gap: 5px; background: #1a1c21; border-radius: 9px; padding: 7px 9px; }
  .promo .pbar i { width: 14px; height: 14px; border-radius: 4px; background: #facc15; }
  .promo .pbar i:nth-child(2) { background: #22c55e; } .promo .pbar i:nth-child(3) { background: #6366f1; } .promo .pbar i:nth-child(4) { background: #3b82f6; } .promo .pbar i:nth-child(5) { background: #ef4444; }
  .promo .pbar b { width: 1px; height: 14px; background: #33363d; margin: 0 2px; }
  .promo .pbar em { font: 600 11px "Segoe UI", system-ui, sans-serif; color: #e9eaee; font-style: normal; }
  .promo .ptext b { display: block; font-size: 15px; margin-bottom: 2px; }
  .promo .ptext span { font-size: 13px; color: #a3a6ae; }
  .promo .pgo { background: #22c55e; color: #03130a; font-weight: 700; font-size: 14px; padding: 10px 14px; border-radius: 10px; white-space: nowrap; }
  @media (max-width: 520px) { .promo { grid-template-columns: 1fr; } .promo .pbar { justify-self: start; } }
  /* the start of the day */
  .intro { text-align: left; }
  .imapw { position: relative; height: clamp(170px, 34vw, 250px); border-radius: 20px; overflow: hidden; border: 1px solid var(--line);
           box-shadow: 0 26px 60px -30px rgba(60,40,10,.6); margin-bottom: 22px; background: var(--sea2); }
  .imapw canvas { position: absolute; left: -6%; top: -8%; width: 112%; height: 116%; animation: drift 26s ease-in-out infinite alternate; }
  .imapw::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 80px rgba(120,90,40,.35); pointer-events: none; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-4%, 3%) scale(1.07); } }
  .ititle { font-size: clamp(32px, 7vw, 50px); letter-spacing: -1px; margin: 4px 0 10px; }
  .isub { color: var(--body); font-size: 16px; line-height: 1.5; margin: 0 0 20px; max-width: 560px; }
  .irow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: 24px; }
  .itile { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: clamp(10px, 2.7vw, 12px); font-weight: 600; color: var(--dim); text-align: center;
           min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
           opacity: 0; animation: deal .55s cubic-bezier(.2,1.3,.4,1) forwards; }
  .itile i { width: 100%; aspect-ratio: 1; max-width: 64px; border-radius: 14px; display: grid; place-items: center; color: var(--acc-ink);
             background: linear-gradient(180deg, #c2771f, var(--acc)); box-shadow: 0 10px 18px -10px rgba(120,60,0,.7), inset 0 1px 0 rgba(255,255,255,.25); }
  .itile i svg { width: 46%; height: 46%; }
  @keyframes deal { from { opacity: 0; transform: translateY(18px) rotate(-6deg) scale(.8); } to { opacity: 1; transform: none; } }
  button.go.big { width: 100%; padding: 18px; font-size: 18px; box-shadow: 0 16px 30px -16px rgba(140,60,0,.8); }
  button.go { transition: transform .15s, box-shadow .2s, filter .2s; }
  button.go:not(:disabled):hover { filter: brightness(1.06); transform: translateY(-1px); }
  button.go:not(:disabled):active { transform: translateY(1px) scale(.99); }
  .inote { color: var(--dim); font-size: 13px; text-align: center; margin: 12px 0 0; }
  /* motion */
  .enter { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .verdict.pop { animation: vpop .55s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes vpop { from { opacity: 0; transform: scale(.9) translateY(6px); } to { opacity: 1; transform: none; } }
  .sq.shake { animation: shake .45s ease-in-out .15s; }
  @keyframes shake { 20%, 60% { transform: translateX(-4px) rotate(-6deg); } 40%, 80% { transform: translateX(4px) rotate(6deg); } }
  .answer.pop { animation: rise .5s cubic-bezier(.2,.8,.2,1) .12s both; }
  .dot.just { animation: dotpop .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes dotpop { 0% { transform: scaleY(1); } 40% { transform: scaleY(2.4); } 100% { transform: scaleY(1); } }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .scoreline { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .rank { font-family: var(--title); font-size: clamp(22px, 5vw, 30px); font-weight: 700; color: var(--acc); opacity: 0; transition: opacity .5s .2s, transform .5s .2s; transform: translateX(-8px); }
  .rank.on { opacity: 1; transform: none; }
  .row .sq.deal { opacity: 0; animation: deal .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  .cardwrap.deal { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; } }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span data-t="brand"></span><small><a class="by" href="/"><svg viewBox="-360 -360 720 720" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M-300 0a300 300 0 1 0 600 0a300 300 0 1 0-600 0ZM-200 0a200 200 0 1 0 400 0a200 200 0 1 0-400 0Z"/><rect x="168" y="-50" width="284" height="100" rx="16" transform="rotate(45)" fill="#22C55E"/></svg><span data-t="by"></span></a></small></div>
    <button class="lang" id="lang"></button>
  </header>
  <div class="dots" id="dots"></div>

  <section class="hide intro" id="intro">
    <div class="imapw"><canvas id="imap" width="1200" height="600"></canvas></div>
    <div class="kind" id="iday"></div>
    <h1 class="ititle" data-t="iTitle"></h1>
    <p class="isub" data-t="iSub"></p>
    <div class="irow" id="irow"></div>
    <button class="go big" id="start" data-t="iGo"></button>
    <p class="inote" data-t="iNote"></p>
  </section>

  <section id="play">
    <div class="kind" id="kind"></div>
    <h1 id="task"></h1>
    <div class="hint" id="hint"></div>
    <div class="how" id="how"></div>

    <div id="numBox" class="hide">
      <div class="field"><input id="guess" inputmode="decimal" autocomplete="off" spellcheck="false"></div>
      <div class="read" id="read"></div>
      <div class="units" id="units"></div>
    </div>
    <div id="yrBox" class="hide">
      <div class="field"><input id="yinput" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="1969"></div>
    </div>
    <div id="mapBox" class="frame hide">
      <svg class="board" id="mapsvg" viewBox="0 0 600 450"></svg>
      <div class="zoom">
        <button id="zin" aria-label="+">+</button>
        <button id="zout" aria-label="-">&minus;</button>
        <button id="zfit" aria-label="fit"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4"/></svg></button>
        <button id="zmove" aria-label="move"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5v15M1.5 9h15M9 1.5 6.8 3.7M9 1.5l2.2 2.2M9 16.5l-2.2-2.2M9 16.5l2.2-2.2M1.5 9l2.2-2.2M1.5 9l2.2 2.2M16.5 9l-2.2-2.2M16.5 9l-2.2 2.2"/></svg></button>
      </div>
    </div>
    <div id="lvBox" class="frame hide"><svg class="board" id="lvsvg" viewBox="0 0 600 640"></svg></div>

    <div class="tools" id="tools">
      <button class="ghost hide" id="clear"></button>
      <button class="go" id="done" disabled></button>
    </div>
    <div class="hide" id="after">
      <div class="verdict"><span class="sq" id="vsq"></span><div><b id="vtext"></b><span class="km" id="vkm"></span></div></div>
      <div class="answer hide" id="ans"></div>
      <div class="fact" id="fact"></div>
      <div class="src" id="src"></div>
      <div class="tools"><button class="go" id="next"></button></div>
    </div>
  </section>

  <section class="hide" id="end">
    <div class="kind" id="enum"></div>
    <h1 id="etitle"></h1>
    <div class="scoreline"><div class="score" id="score"></div><div class="rank" id="rank"></div></div>
    <div class="row" id="row"></div>
    <div class="cardwrap"><img id="cardimg" alt=""></div>
    <div class="tools"><button class="go" id="share"></button></div>
    <div class="tools sub"><button class="ghost" id="save"></button><button class="ghost" id="copytext"></button></div>
    <div class="copied" id="copied"></div>
    <div class="wait" id="wait"></div>
    <a class="promo" href="/" id="promo">
      <div class="pbar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b><em>18:24</em></div>
      <div class="ptext"><b data-t="pTitle"></b><span data-t="pText"></span></div>
      <span class="pgo" data-t="pGo"></span>
    </a>
    <div class="review" id="review"></div>
  </section>

  <div class="legend" id="legend"></div>
  <footer>
    <p data-t="made"></p>
    <a class="btn" href="https://quoline.app" data-t="get"></a>
  </footer>
  <div class="credit" data-t="credit"></div>
</div>

<canvas id="fx"></canvas>
<script src="questions.js"></script>
